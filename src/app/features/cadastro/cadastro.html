<main class="cadastro-page">

  <section class="cadastro-card">

    <div class="logo">

      <mat-icon>play_circle</mat-icon>

      <span>Animex</span>

    </div>


    <h1>Criar conta</h1>

    <p class="subtitulo">
      Crie sua conta e comece a acompanhar seus animes favoritos.
    </p>


    <form (ngSubmit)="criarConta()">


      <mat-form-field appearance="outline">

        <mat-label>Nome</mat-label>

        <input
          matInput
          type="text"
          name="nome"
          [(ngModel)]="nome"
          required
        >

        <mat-icon matPrefix>person</mat-icon>

      </mat-form-field>


      <mat-form-field appearance="outline">

        <mat-label>E-mail</mat-label>

        <input
          matInput
          type="email"
          name="email"
          [(ngModel)]="email"
          required
        >

        <mat-icon matPrefix>email</mat-icon>

      </mat-form-field>


      <mat-form-field appearance="outline">

        <mat-label>Senha</mat-label>

        <input
          matInput
          type="password"
          name="senha"
          [(ngModel)]="senha"
          required
        >

        <mat-icon matPrefix>lock</mat-icon>

      </mat-form-field>


      <mat-form-field appearance="outline">

        <mat-label>Confirmar senha</mat-label>

        <input
          matInput
          type="password"
          name="confirmarSenha"
          [(ngModel)]="confirmarSenha"
          required
        >

        <mat-icon matPrefix>lock</mat-icon>

      </mat-form-field>


      @if (mensagem) {

        <p class="erro">
          {{ mensagem }}
        </p>

      }


      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="botao"
      >

        Criar conta

      </button>


    </form>


    <p class="login">

      Já possui uma conta?

      <a routerLink="/login">
        Entrar
      </a>

    </p>

  </section>

</main>
